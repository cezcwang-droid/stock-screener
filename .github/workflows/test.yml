name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 快速测试（评分模型 + app + screener + 回测核心函数）──
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_backtest_runner.py \
            -v --tb=short -x
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ── 回测端到端（耗时较长，仅跑一次）──
  backtest:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backtest end-to-end tests
        run: |
          python -m pytest tests/test_backtest_runner.py \
            -v --tb=short -x
        env:
          PYTHONPATH: ${{ github.workspace }}
